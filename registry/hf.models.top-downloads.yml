# Field shape verified against the live API on 2026-08-31 (see git history).
source_id: hf.models.top-downloads
status: active
cadence: daily
schema_id: adoption.v1

publisher: Hugging Face
publisher_tier: first_party
destroys_own_history: true   # rolling windows and running totals only; no history endpoint
licence: "Hub metadata via public API; see https://huggingface.co/terms-of-service"
personal_data: none
storage: git

notes: >-
  Interest 2/4: global model usage head, unfiltered — slice later by pipeline_tag/library/tags. tags carry arxiv ids, the paper->model adoption link for interest 5.

endpoints:
  - url: "https://huggingface.co/api/models?sort=downloads&direction=-1&limit=1000&expand[]=downloads&expand[]=downloadsAllTime&expand[]=likes&expand[]=createdAt&expand[]=lastModified&expand[]=pipeline_tag&expand[]=library_name&expand[]=tags"
    delay_seconds: 2

gates:
  expect_status: 200
  min_bytes: 10000
  content_type_any: [json]
  must_contain: ["downloads"]
  must_not_contain: ["Access Denied"]
  max_shrink_pct: 50
